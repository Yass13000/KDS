<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Couleur de la barre d'état dynamique (Clair / Sombre) -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F172A" />
    <meta name="theme-color" content="#0F172A" />
    
    <!-- Spécificités iOS / Safari PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KDS Cuisine" />
    
    <!-- Liaison du manifest W3C -->
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Favicons et Icônes Apple Touch -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/iconmob.png" />
    
    <link rel="preload" href="/fonts/DunkinSans-ExtraBold.otf" as="font" type="font/otf" crossorigin />
    
    <script>
      function loadGoogleMaps() {
        if (window.google && window.google.maps) return;
        const script = document.createElement('script');
        script.async = true;
        script.defer = true;
        script.src = 'https://maps.googleapis.com/maps/api/js?key=AIzaSyBV4XXE1heGXMwhX3iuOtjeoGAiw4Njero&libraries=places&loading=async&callback=initGoogleMaps';
        document.head.appendChild(script);
      }
      function initGoogleMaps() { window.dispatchEvent(new Event('google-maps-loaded')); }
      window.addEventListener('load', () => { setTimeout(loadGoogleMaps, 2000); });
    </script>
    
    <title>KDS - Ecran cuisine</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) { registration.unregister(); }
        });
      }
    </script>
  </body>
</html>
